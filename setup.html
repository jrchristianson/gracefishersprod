<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gear Inventory Setup</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root { --bg: #eef1f5; --surface: #fff; --ink: #16202c; --muted: #5a6574; --line: #d9dfe7; --primary: #1d4d8c; --tag: #f2b51c; --ok: #1f7a4d; --crit: #b3261e; color-scheme: light;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f141a; --surface: #171e27; --ink: #e5eaf1; --muted: #97a2b2; --line: #2a3442; --primary: #6fa3e6; --ok: #6fd3a0; --crit: #f28b82; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
main { max-width: 680px; margin: 0 auto; padding: 40px 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px; }
.tag { display: inline-block; font: 600 12.5px/1 var(--mono); padding: 5px 7px; border-radius: 3px; background: var(--tag); color: #1b1505; }
h1 { font: 700 32px/1.05 var(--display); text-transform: uppercase; margin: 12px 0 8px; }
p { color: var(--muted); margin: 0 0 16px; }
code { font-family: var(--mono); font-size: 13px; }
button { font: inherit; height: 40px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--primary); background: var(--primary); color: #fff; cursor: pointer; font-weight: 600; }
button:disabled { opacity: .5; cursor: wait; }
ol { margin: 20px 0 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 13px; }
ol li { padding: 6px 0; border-top: 1px solid var(--line); }
li.ok::before { content: "✓ "; color: var(--ok); } li.err { color: var(--crit); } li.err::before { content: "✕ "; }
a { color: var(--primary); }
</style>
</head>
<body>
<main><div class="card">
  <span class="tag">SETUP</span>
  <h1>Create the inventory lists</h1>
  <p>Run this once. It creates four lists on your SharePoint site, <code id="site"></code>: <b>GF Equipment</b>, <b>GF Equipment Log</b>, <b>GF Supplies</b> and <b>GF Supply Log</b>. Lists that already exist are left alone, and any missing columns are added.</p>
  <p>Sign in with an account that owns the SharePoint site.</p>
  <button id="go">Sign in and create lists</button>
  <ol id="log"></ol>
</div></main>
<script src="config.js"></script>
<script src="vendor/msal-browser.min.js"></script>
<script>
"use strict";
const C = window.GF_CONFIG || {};
const LISTS = Object.assign({ equipment: "GF Equipment", equipmentLog: "GF Equipment Log", supplies: "GF Supplies", supplyLog: "GF Supply Log" }, C.lists || {});
const SCOPES = ["Sites.Manage.All"];
const GRAPH = "https://graph.microsoft.com/v1.0";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function log(msg, cls = "ok") { const li = document.createElement("li"); li.className = cls; li.textContent = msg; $("#log").appendChild(li); }

const text = (name, displayName, extra = {}) => ({ name, displayName, text: {}, ...extra });
const note = (name, displayName) => ({ name, displayName, text: { allowMultipleLines: true, linesForEditing: 6, textType: "plain" } });
const num = (name, displayName) => ({ name, displayName, number: { decimalPlaces: "none" } });
const SCHEMA = {
  equipment: { title: "Item name", columns: [
    text("AssetTag", "Asset tag", { indexed: true }), text("Category", "Category"), text("Location", "Location"), text("Make", "Make"), text("Model", "Model"),
    text("SerialNumber", "Serial number"), note("Notes", "Notes"),
    { name: "Status", displayName: "Status", choice: { choices: ["Available", "Checked out", "Needs repair", "Out for service", "Retired"], displayAs: "dropDownMenu", allowTextEntry: false }, defaultValue: { value: "Available" } },
    text("Borrower", "Checked out to"), text("CheckedOutOn", "Checked out on"), text("DueBack", "Due back"), text("CheckoutNote", "Checkout note")] },
  equipmentLog: { title: "Event", columns: [text("AssetTag", "Asset tag", { indexed: true }), text("Kind", "Kind"), note("Detail", "Detail"), text("Borrower", "Borrower")] },
  supplies: { title: "Supply", columns: [
    text("BinCode", "Bin code", { indexed: true }), text("Category", "Category"), text("Location", "Location"), num("OnHand", "On hand"), text("Unit", "Counted in"),
    num("ReorderAt", "Reorder at"), text("ReorderInfo", "Where to reorder"), note("Notes", "Notes")] },
  supplyLog: { title: "Event", columns: [text("BinCode", "Bin code", { indexed: true }), text("Kind", "Kind"), num("Change", "Change"), num("OnHandAfter", "On hand after"), text("Note", "Note")] },
};

let pca, account;
async function token() {
  try { return (await pca.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch (e) { if (e instanceof msal.InteractionRequiredAuthError) await pca.acquireTokenRedirect({ scopes: SCOPES }); throw e; }
}
async function g(method, path, body) {
  const r = await fetch(path.startsWith("http") ? path : GRAPH + path, { method, headers: { Authorization: "Bearer " + await token(), Accept: "application/json", ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 204) return null;
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error(j?.error?.message || `${r.status} ${r.statusText}`);
  return j;
}
async function gAll(path) { const out = []; let url = path; while (url) { const j = await g("GET", url); out.push(...(j.value || [])); url = j["@odata.nextLink"] || null; } return out; }

async function run() {
  $("#go").disabled = true;
  try {
    const u = new URL(C.siteUrl), path = u.pathname.replace(/\/+$/, "");
    const site = await g("GET", path ? `/sites/${u.hostname}:${path}` : `/sites/${u.hostname}`);
    log(`Found site “${site.displayName}”`);
    const existing = await gAll(`/sites/${site.id}/lists?$select=id,displayName`);
    for (const [key, def] of Object.entries(SCHEMA)) {
      const name = LISTS[key];
      let list = existing.find((l) => l.displayName === name);
      if (!list) {
        list = await g("POST", `/sites/${site.id}/lists`, { displayName: name, columns: def.columns, list: { template: "genericList" } });
        log(`Created list “${name}”`);
      } else {
        const cols = await gAll(`/sites/${site.id}/lists/${list.id}/columns?$select=id,name`);
        const missing = def.columns.filter((c) => !cols.some((x) => x.name === c.name));
        for (const c of missing) await g("POST", `/sites/${site.id}/lists/${list.id}/columns`, c);
        log(missing.length ? `“${name}” already existed; added ${missing.length} missing column(s)` : `“${name}” already existed and is complete`);
      }
      try {
        const cols = await gAll(`/sites/${site.id}/lists/${list.id}/columns?$select=id,name,displayName`);
        const title = cols.find((c) => c.name === "Title");
        if (title && title.displayName !== def.title) await g("PATCH", `/sites/${site.id}/lists/${list.id}/columns/${title.id}`, { displayName: def.title });
      } catch { /* renaming the Title column is cosmetic */ }
    }
    log("All set. Open the inventory app.", "ok");
    const li = document.createElement("li"); li.innerHTML = `<a href="./">Go to Gear Inventory →</a>`; $("#log").appendChild(li);
  } catch (e) { log("Stopped: " + e.message, "err"); $("#go").disabled = false; }
}

(async () => {
  $("#site").textContent = C.siteUrl || "(siteUrl not set in config.js)";
  if (!C.tenantId || !C.clientId || !C.siteUrl) { log("Fill in tenantId, clientId and siteUrl in config.js first.", "err"); $("#go").disabled = true; return; }
  pca = await msal.PublicClientApplication.createPublicClientApplication({
    auth: { clientId: C.clientId, authority: "https://login.microsoftonline.com/" + C.tenantId, redirectUri: location.origin + location.pathname },
    cache: { cacheLocation: "sessionStorage" },
  });
  const res = await pca.handleRedirectPromise().catch((e) => { log("Sign-in failed: " + e.message, "err"); return null; });
  account = res?.account || pca.getAllAccounts()[0] || null;
  $("#go").onclick = () => account ? run() : pca.loginRedirect({ scopes: SCOPES });
  if (account) { $("#go").textContent = `Create lists as ${account.name || account.username}`; if (res) run(); }
})();
</script>
</body>
</html>
